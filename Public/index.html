<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pentu</title>
    <link rel="icon" href="pentuhead.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="/" class="logo-link">
            <img src="pentu.png" alt="Pentu" class="logo">
        </a>
    </header>

    <main>
        <section class="subida">
            <h2>Subir un video</h2>
            <form id="form-subida">
                <input type="text" name="titulo" placeholder="Título del video" maxlength="100" required>
                <input type="file" id="archivo" name="video" accept=".mp4,.m4v,.webm,.ogv" required>
                <button type="submit">Subir</button>
            </form>
            <progress id="barra" max="100" value="0" hidden></progress>
            <p id="estado" role="status"></p>
        </section>

        <section>
            <h2>Videos</h2>
            <div id="lista-videos" class="grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
